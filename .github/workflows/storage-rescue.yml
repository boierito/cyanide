name: Storage Rescue IPA

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, "agent/storage-cleaner-ui", "agent/progressive-cleaner-feedback", "agent/progressive-cleaner-1.2.1-fix"]
    paths:
      - ".github/workflows/storage-rescue.yml"
      - "StorageRescue.xcconfig"
      - "scripts/build.sh"
      - "scripts/generate_storage_cleaner_icon.py"
      - "Cyanide/Assets.xcassets/AppIcon.appiconset/**"
      - "Cyanide/StorageCleanerProgressiveViewController.h"
      - "Cyanide/StorageCleanerProgressiveViewController.m"
      - "Cyanide/StorageCleanerPolishedSafeViewController.h"
      - "Cyanide/StorageCleanerPolishedSafeViewController.m"
      - "Cyanide/StorageCleanerFullscreenStartupViewController.h"
      - "Cyanide/StorageCleanerFullscreenStartupViewController.m"
      - "Cyanide/StorageCleanerIntroViewController.h"
      - "Cyanide/StorageCleanerIntroViewController.m"
      - "Cyanide/StorageRescueHomeViewController.h"
      - "Cyanide/StorageRescueHomeViewController.m"
      - "Cyanide/StorageRescueCleanupViewController.h"
      - "Cyanide/StorageRescueCleanupViewController.m"
      - "Cyanide/StorageRescueDedicatedViewController.h"
      - "Cyanide/StorageRescueDedicatedViewController.m"
      - "Cyanide/StorageRescueGuideViewController.h"
      - "Cyanide/StorageRescueGuideViewController.m"
      - "Cyanide/StorageRescueRecoveryViewController.h"
      - "Cyanide/StorageRescueRecoveryViewController.m"
      - "Cyanide/StorageRescueSolverViewController.h"
      - "Cyanide/StorageRescueSolverViewController.m"
      - "Cyanide/SceneDelegate.m"
      - "Cyanide/Info.plist"
      - "README.md"

permissions:
  contents: read

jobs:
  build-storage-rescue:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install build dependencies
        run: |
          brew install ldid
          command -v ldid
          ldid -h >/dev/null 2>&1 || true

      - name: Verify Gain Access isolation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path("Cyanide/StorageCleanerPolishedSafeViewController.m").read_text()
          overlay = Path("Cyanide/StorageCleanerFullscreenStartupViewController.m").read_text()
          config = Path("StorageRescue.xcconfig").read_text()

          # The proven automatic-access implementation remains in the same class.
          assert "- (void)updateChrome" not in source
          assert "- (void)scanCurrentMode" not in source
          assert "[self scRunCountdown:5]" in source
          assert "[self prepareAccess]" in source

          wait = source.index("- (void)scWaitForIdleThenResolveNames")
          prepared_gate = source.index("if (!prepared) return;", wait)
          busy_gate = source.index("if (busy)", prepared_gate)
          background_work = source.index("dispatch_async(dispatch_get_global_queue", busy_gate)
          bundle_walk = source.index("/var/containers/Bundle/Application", background_work)
          assert wait < prepared_gate < busy_gate < background_work < bundle_walk

          # The new subclass is presentation-only: it may replace the overlay,
          # but it cannot wrap or replace Gain Access / countdown / scan behavior.
          assert "- (void)viewDidAppear" not in overlay
          assert "- (void)scRunCountdown" not in overlay
          assert "- (void)scMonitorAutomaticAccess" not in overlay
          assert "prepareAccess" not in overlay
          assert "self.view.window" in overlay
          assert "bringSubviewToFront" in overlay

          assert "PRODUCT_BUNDLE_IDENTIFIER = com.ai.StorageCleaner" in config
          assert "MARKETING_VERSION = 1.2.3" in config
          assert "CURRENT_PROJECT_VERSION = 14" in config
          assert "ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon" in config
          PY

      - name: Generate Storage Cleaner icon
        run: |
          python3 scripts/generate_storage_cleaner_icon.py
          test -s Cyanide/Assets.xcassets/AppIcon.appiconset/icon-ios-1024x1024.png
          WIDTH=$(sips -g pixelWidth Cyanide/Assets.xcassets/AppIcon.appiconset/icon-ios-1024x1024.png | awk '/pixelWidth/ {print $2}')
          HEIGHT=$(sips -g pixelHeight Cyanide/Assets.xcassets/AppIcon.appiconset/icon-ios-1024x1024.png | awk '/pixelHeight/ {print $2}')
          test "$WIDTH" = "1024"
          test "$HEIGHT" = "1024"

      - name: Build unsigned IPA
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh

      - name: Upload Xcode diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Storage-Rescue-Xcode-Log
          path: build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify final IPA identity and runtime dependencies
        run: |
          read_xcconfig_value() {
            local key="$1"
            sed -nE "s/^[[:space:]]*${key}[[:space:]]*=[[:space:]]*(.*[^[:space:]])[[:space:]]*$/\\1/p" StorageRescue.xcconfig | tail -n 1
          }

          EXPECTED_DISPLAY_NAME="$(read_xcconfig_value INFOPLIST_KEY_CFBundleDisplayName)"
          EXPECTED_BUNDLE_ID="$(read_xcconfig_value PRODUCT_BUNDLE_IDENTIFIER)"
          EXPECTED_VERSION="$(read_xcconfig_value MARKETING_VERSION)"
          EXPECTED_BUILD="$(read_xcconfig_value CURRENT_PROJECT_VERSION)"

          test "$EXPECTED_BUNDLE_ID" = "com.ai.StorageCleaner"

          rm -rf /tmp/storage-rescue-verify
          mkdir -p /tmp/storage-rescue-verify
          unzip -q -o build/Storage-Rescue.ipa -d /tmp/storage-rescue-verify
          APP="/tmp/storage-rescue-verify/Payload/Cyanide.app"
          PLIST="$APP/Info.plist"
          EXECUTABLE="$APP/Cyanide"
          XPF_DYLIB="$APP/libxpf.dylib"

          test -f "$PLIST"
          test -x "$EXECUTABLE"
          test -f "$XPF_DYLIB"
          test -f "$APP/Assets.car"

          DISPLAY_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$PLIST")
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$PLIST")
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST")
          echo "Display name: $DISPLAY_NAME"
          echo "Bundle ID: $BUNDLE_ID"
          echo "Version: $VERSION ($BUILD)"
          test "$DISPLAY_NAME" = "$EXPECTED_DISPLAY_NAME"
          test "$BUNDLE_ID" = "$EXPECTED_BUNDLE_ID"
          test "$VERSION" = "$EXPECTED_VERSION"
          test "$BUILD" = "$EXPECTED_BUILD"

          if command -v assetutil >/dev/null 2>&1; then
            assetutil --info "$APP/Assets.car" | grep -F 'AppIcon' >/dev/null
          fi

          echo "Executable dependencies:"
          xcrun otool -L "$EXECUTABLE"
          xcrun otool -L "$EXECUTABLE" | grep -F '@loader_path/libxpf.dylib'

          echo "libxpf.dylib dependencies:"
          xcrun otool -L "$XPF_DYLIB"

          while IFS= read -r dependency; do
            case "$dependency" in
              @loader_path/*)
                relative="${dependency#@loader_path/}"
                if [ ! -e "$APP/$relative" ]; then
                  echo "error: missing runtime dependency $dependency" >&2
                  exit 1
                fi
                ;;
            esac
          done < <(xcrun otool -L "$EXECUTABLE" | tail -n +2 | awk '{print $1}')

      - name: Prepare artifact
        run: |
          mkdir -p build/storage-rescue-artifact
          cp -L build/Storage-Rescue.ipa build/storage-rescue-artifact/Storage-Rescue.ipa
          ls -lh build/storage-rescue-artifact

      - name: Upload Storage Rescue
        uses: actions/upload-artifact@v4
        with:
          name: Storage-Rescue
          path: build/storage-rescue-artifact/Storage-Rescue.ipa
          if-no-files-found: error
          compression-level: 0
