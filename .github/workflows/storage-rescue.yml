name: Storage Rescue IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/storage-rescue.yml"
      - ".github/scripts/inject_storage_rescue.py"
      - "storage-rescue.js"

permissions:
  contents: read

jobs:
  build-storage-rescue:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Inject Storage Rescue POSIX bridges
        run: python3 .github/scripts/inject_storage_rescue.py

      - name: Build unsigned IPA
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh

      - name: Prepare artifact
        run: |
          mkdir -p build/storage-rescue-artifact
          cp -L build/Cyanide.ipa build/storage-rescue-artifact/Cyanide-StorageRescue.ipa
          cp storage-rescue.js build/storage-rescue-artifact/storage-rescue.js
          ls -lh build/storage-rescue-artifact

      - name: Upload Storage Rescue
        uses: actions/upload-artifact@v4
        with:
          name: Cyanide-StorageRescue
          path: build/storage-rescue-artifact/*
          if-no-files-found: error
          compression-level: 0
