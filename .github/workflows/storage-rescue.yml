name: Storage Rescue IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/storage-rescue.yml"
      - "StorageRescue.xcconfig"
      - "scripts/build.sh"
      - "Cyanide/StorageRescueDedicatedViewController.h"
      - "Cyanide/StorageRescueDedicatedViewController.m"
      - "Cyanide/StorageRescueGuideViewController.h"
      - "Cyanide/StorageRescueGuideViewController.m"
      - "Cyanide/StorageRescueRecoveryViewController.h"
      - "Cyanide/StorageRescueRecoveryViewController.m"
      - "Cyanide/StorageRescueSolverViewController.h"
      - "Cyanide/StorageRescueSolverViewController.m"
      - "Cyanide/SceneDelegate.m"
      - "Cyanide/Info.plist"

permissions:
  contents: read

jobs:
  build-storage-rescue:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build unsigned IPA
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh

      - name: Verify product identity
        run: |
          APP="build/DerivedData/Build/Products/Debug-iphoneos/Cyanide.app"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist")" = "Storage Rescue"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "io.github.boierito.storagerescue"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = "1.1.0"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = "110"

      - name: Prepare artifact
        run: |
          mkdir -p build/storage-rescue-artifact
          cp -L build/Storage-Rescue.ipa build/storage-rescue-artifact/Storage-Rescue.ipa
          ls -lh build/storage-rescue-artifact

      - name: Upload Storage Rescue
        uses: actions/upload-artifact@v4
        with:
          name: Storage-Rescue
          path: build/storage-rescue-artifact/Storage-Rescue.ipa
          if-no-files-found: error
          compression-level: 0
