name: Storage Rescue IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/storage-rescue.yml"

permissions:
  contents: read

jobs:
  build-storage-rescue:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Inject Storage Rescue POSIX bridges
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("Cyanide/tweaks/QuickLoader.m")
          s = p.read_text()

          # errno constants + errno for local POSIX calls.
          if '#import <errno.h>' not in s:
              s = s.replace('#import <unistd.h>\n', '#import <unistd.h>\n#import <errno.h>\n', 1)

          anchor = '        context[@"r_nsstr"] = ^NSString*(NSString *str) {'
          if anchor not in s:
              raise SystemExit("QuickLoader bridge anchor not found")

          bridge = r'''
        // ===============================================================
        // Storage Rescue bridge
        // HARD boundary: /var/mobile/Documents/test only.
        // Actual deletion uses POSIX unlink(2)/rmdir(2), never NSFileManager.
        // Tries Cyanide-local libc first, then the active RemoteCall target.
        // ===============================================================
        __block int32_t storageRescueLastErrno = 0;
        __block NSString *storageRescueLastBackend = @"none";

        BOOL (^storageRescuePathAllowed)(NSString *) = ^BOOL(NSString *path) {
            if (![path isKindOfClass:NSString.class] || path.length == 0) return NO;
            NSString *safe = [path stringByStandardizingPath];
            NSString *root = @"/var/mobile/Documents/test";
            if ([safe isEqualToString:root]) return YES;
            return [safe hasPrefix:[root stringByAppendingString:@"/"]];
        };

        int32_t (^storageRescueRemoteErrno)(void) = ^int32_t(void) {
            uint64_t errnoPtr = r_dlsym_call(R_TIMEOUT, "__error",
                                             0, 0, 0, 0, 0, 0, 0, 0);
            int32_t e = 0;
            if (errnoPtr) remote_read(errnoPtr, &e, sizeof(e));
            return e;
        };

        context[@"r_read_str"] = ^NSString*(JSValue *remoteValue) {
            if (!quickloader_generation_is_active(runGeneration)) return @"";
            uint64_t ptr = js_to_uint64(remoteValue);
            if (!ptr) return @"";
            char buf[4096];
            memset(buf, 0, sizeof(buf));
            if (!r_read_nsstring(ptr, buf, sizeof(buf))) return @"";
            NSString *out = [NSString stringWithUTF8String:buf];
            return out ?: @"";
        };

        context[@"sr_unlink"] = ^NSNumber*(NSString *path) {
            if (!quickloader_generation_is_active(runGeneration)) return @(-1);
            NSString *safe = [path stringByStandardizingPath];
            if (!storageRescuePathAllowed(safe)) {
                storageRescueLastErrno = EPERM;
                storageRescueLastBackend = @"blocked";
                log_user("[StorageRescue] BLOCK unlink: %s\n", path.UTF8String);
                return @(-1);
            }

            errno = 0;
            int localRC = unlink(safe.fileSystemRepresentation);
            int localErr = (localRC == 0) ? 0 : errno;
            if (localRC == 0) {
                storageRescueLastErrno = 0;
                storageRescueLastBackend = @"local";
                return @(0);
            }

            uint64_t remotePath = r_alloc_str(safe.UTF8String);
            if (!remotePath) {
                storageRescueLastErrno = localErr ? localErr : ENOMEM;
                storageRescueLastBackend = @"local";
                return @(-1);
            }

            uint64_t raw = r_dlsym_call(R_TIMEOUT, "unlink",
                                        remotePath, 0, 0, 0, 0, 0, 0, 0);
            int remoteRC = (int32_t)(uint32_t)raw;
            int remoteErr = (remoteRC == 0) ? 0 : storageRescueRemoteErrno();
            r_free(remotePath);

            storageRescueLastErrno = remoteErr;
            storageRescueLastBackend = @"remote";
            return @(remoteRC);
        };

        context[@"sr_rmdir"] = ^NSNumber*(NSString *path) {
            if (!quickloader_generation_is_active(runGeneration)) return @(-1);
            NSString *safe = [path stringByStandardizingPath];
            if (!storageRescuePathAllowed(safe)) {
                storageRescueLastErrno = EPERM;
                storageRescueLastBackend = @"blocked";
                log_user("[StorageRescue] BLOCK rmdir: %s\n", path.UTF8String);
                return @(-1);
            }

            errno = 0;
            int localRC = rmdir(safe.fileSystemRepresentation);
            int localErr = (localRC == 0) ? 0 : errno;
            if (localRC == 0) {
                storageRescueLastErrno = 0;
                storageRescueLastBackend = @"local";
                return @(0);
            }

            uint64_t remotePath = r_alloc_str(safe.UTF8String);
            if (!remotePath) {
                storageRescueLastErrno = localErr ? localErr : ENOMEM;
                storageRescueLastBackend = @"local";
                return @(-1);
            }

            uint64_t raw = r_dlsym_call(R_TIMEOUT, "rmdir",
                                        remotePath, 0, 0, 0, 0, 0, 0, 0);
            int remoteRC = (int32_t)(uint32_t)raw;
            int remoteErr = (remoteRC == 0) ? 0 : storageRescueRemoteErrno();
            r_free(remotePath);

            storageRescueLastErrno = remoteErr;
            storageRescueLastBackend = @"remote";
            return @(remoteRC);
        };

        context[@"sr_errno"] = ^NSNumber*() {
            return @(storageRescueLastErrno);
        };

        context[@"sr_backend"] = ^NSString*() {
            return storageRescueLastBackend ?: @"none";
        };

        context[@"sr_strerror"] = ^NSString*() {
            const char *msg = strerror(storageRescueLastErrno);
            return msg ? [NSString stringWithUTF8String:msg] : @"unknown";
        };
'''

          s = s.replace(anchor, bridge + "\n" + anchor, 1)
          p.write_text(s)
          print("Storage Rescue bridges injected")
          PY

      - name: Generate Storage Rescue QuickLoader script
        shell: bash
        run: |
          mkdir -p build
          cat > build/storage-rescue.js <<'JS'
          // Cyanide Storage Rescue
          // Requires the Storage Rescue IPA built by this workflow.
          // Actual removal uses POSIX unlink()/rmdir().
          // @param: switch | executeNow | ELIMINAR /var/mobile/Documents/test | false
          // @param: number | delayMs | Pausa por operación (ms) | 25 | 10-1000

          (() => {
              const ROOT = "/var/mobile/Documents/test";
              let delay = Number(delayMs) || 25;
              if (delay < 10) delay = 10;
              if (delay > 1000) delay = 1000;

              function p(v) {
                  const s = String(v || "0x0");
                  if (s.indexOf("0x") === 0) return parseInt(s.slice(2), 16) || 0;
                  return Number(s) || 0;
              }

              function fail(op, path) {
                  log(op + " FAILED errno=" + sr_errno() +
                      " (" + sr_strerror() + ") backend=" + sr_backend() +
                      " path=" + path);
              }

              log("=== STORAGE RESCUE ===");
              log("Target: " + ROOT);

              if (!executeNow) {
                  log("SAFE MODE: executeNow=OFF. No se eliminó nada.");
                  log("Activa ELIMINAR /var/mobile/Documents/test para ejecutar.");
                  return;
              }

              const fmClass = r_class("NSFileManager");
              const fm = r_msg2(fmClass, "defaultManager");
              const root = r_nsstr(ROOT);

              if (!p(r_msg2(fm, "fileExistsAtPath:", root))) {
                  log("La ruta no existe.");
                  r_msg2(root, "release");
                  return;
              }

              const en = r_msg2(fm, "enumeratorAtPath:", root);
              if (!p(en)) {
                  log("ERROR: no pude crear NSDirectoryEnumerator.");
                  r_msg2(root, "release");
                  return;
              }
              r_msg2(en, "retain");

              const entries = [];
              let scanned = 0;
              let scanTimer = 0;

              log("Fase 1/2: enumerando sin borrar...");
              scanTimer = setInterval(() => {
                  const relPtr = r_msg2(en, "nextObject");
                  if (!p(relPtr)) {
                      clearInterval(scanTimer);
                      r_msg2(en, "release");
                      log("Enumeración terminada: " + entries.length + " entradas.");
                      setTimeout(startDelete, 250);
                      return;
                  }

                  const rel = r_read_str(relPtr);
                  if (rel && rel.indexOf("..") === -1) entries.push(rel);
                  scanned++;
                  if ((scanned % 100) === 0) log("Enumeradas: " + scanned);
              }, delay);

              function startDelete() {
                  log("Fase 2/2: POSIX unlink/rmdir...");
                  let i = entries.length - 1;
                  let removedFiles = 0;
                  let removedDirs = 0;
                  let failed = 0;
                  let done = 0;

                  const delTimer = setInterval(() => {
                      if (i < 0) {
                          clearInterval(delTimer);

                          const rootRC = Number(sr_rmdir(ROOT));
                          if (rootRC === 0) {
                              removedDirs++;
                              log("ROOT eliminado con rmdir().");
                          } else {
                              failed++;
                              fail("rmdir(root)", ROOT);
                          }

                          log("=== RESULTADO ===");
                          log("Entradas: " + entries.length);
                          log("Archivos/symlinks eliminados: " + removedFiles);
                          log("Directorios eliminados: " + removedDirs);
                          log("Fallos: " + failed);

                          const existsAfter = p(r_msg2(fm, "fileExistsAtPath:", root));
                          log("Root existe al final: " + (existsAfter ? "SI" : "NO"));
                          if (!existsAfter) log("SUCCESS: limpieza completada.");

                          r_msg2(root, "release");
                          return;
                      }

                      const rel = entries[i--];
                      const full = ROOT + "/" + rel;

                      const urc = Number(sr_unlink(full));
                      if (urc === 0) {
                          removedFiles++;
                      } else {
                          const rrc = Number(sr_rmdir(full));
                          if (rrc === 0) {
                              removedDirs++;
                          } else {
                              failed++;
                              if (failed <= 30) fail("unlink+rmdir", full);
                          }
                      }

                      done++;
                      if ((done % 100) === 0) {
                          log("Borradas/procesadas: " + done + "/" + entries.length +
                              " files=" + removedFiles + " dirs=" + removedDirs +
                              " fail=" + failed);
                      }
                  }, delay);
              }
          })();
          JS

      - name: Build unsigned IPA
        shell: bash
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p build/storage-rescue-artifact
          cp -L build/Cyanide.ipa build/storage-rescue-artifact/Cyanide-StorageRescue.ipa
          cp build/storage-rescue.js build/storage-rescue-artifact/storage-rescue.js
          ls -lh build/storage-rescue-artifact

      - name: Upload Storage Rescue
        uses: actions/upload-artifact@v4
        with:
          name: Cyanide-StorageRescue
          path: build/storage-rescue-artifact/*
          if-no-files-found: error
          compression-level: 0
