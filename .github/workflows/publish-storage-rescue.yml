# Release trigger: Storage Cleaner 1.1.5 functional baseline
name: Publish Storage Cleaner

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-storage-rescue.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install build dependencies
        run: |
          brew install ldid
          command -v ldid

      - name: Build unsigned IPA
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh
          cp -L build/Storage-Rescue.ipa build/Storage-Cleaner-release.ipa
          ls -lh build/Storage-Cleaner-release.ipa

      - name: Read product identity
        id: identity
        run: |
          APP="build/DerivedData/Build/Products/Debug-iphoneos/Cyanide.app"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist")
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          DISPLAY_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APP/Info.plist")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "bundle_id=$BUNDLE_ID" >> "$GITHUB_OUTPUT"
          test "$DISPLAY_NAME" = "Storage Cleaner"
          test "$BUNDLE_ID" = "com.boierito.cyanide"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.identity.outputs.version }}
          BUILD: ${{ steps.identity.outputs.build }}
          BUNDLE_ID: ${{ steps.identity.outputs.bundle_id }}
        run: |
          TAG="storage-cleaner-v${VERSION}"
          IPA="build/Storage-Cleaner-${VERSION}.ipa"
          mv build/Storage-Cleaner-release.ipa "$IPA"

          cat > /tmp/release-notes.md <<EOF
          # Storage Cleaner ${VERSION}

          Functional baseline release before the next cleaner-performance iteration.

          **Bundle ID:** \`${BUNDLE_ID}\`  
          **Version:** \`${VERSION}\`  
          **Build:** \`${BUILD}\`

          ## Included

          - Storage Cleaner frontend with Apps and System Cache presentation.
          - Gain Access / scanning / cleanup backend kept on the proven main implementation.
          - Protected cleanup remains available as the advanced fallback.
          - Runtime dependency validation for \`libxpf.dylib\`.

          ## Installation

          \`Storage-Cleaner-${VERSION}.ipa\` is unsigned and must be signed/sideloaded using a compatible method for the target device.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA" --clobber
            gh release edit "$TAG" --title "Storage Cleaner ${VERSION}" --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" "$IPA" \
              --target "$GITHUB_SHA" \
              --title "Storage Cleaner ${VERSION}" \
              --notes-file /tmp/release-notes.md
          fi
