name: Publish Storage Rescue

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build unsigned IPA
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh
          cp -L build/Storage-Rescue.ipa build/Storage-Rescue-release.ipa
          ls -lh build/Storage-Rescue-release.ipa

      - name: Read product identity
        id: identity
        run: |
          APP="build/DerivedData/Build/Products/Debug-iphoneos/Cyanide.app"
          VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist")
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          DISPLAY_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$APP/Info.plist")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "bundle_id=$BUNDLE_ID" >> "$GITHUB_OUTPUT"
          test "$DISPLAY_NAME" = "Storage Rescue"
          test "$BUNDLE_ID" = "io.github.boierito.storagerescue"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.identity.outputs.version }}
          BUILD: ${{ steps.identity.outputs.build }}
          BUNDLE_ID: ${{ steps.identity.outputs.bundle_id }}
        run: |
          TAG="storage-rescue-v${VERSION}"
          mv build/Storage-Rescue-release.ipa "build/Storage-Rescue-${VERSION}.ipa"

          cat > /tmp/release-notes.md <<EOF
          # Storage Rescue ${VERSION}

          Storage Rescue is a dedicated iOS cache-cleanup and recovery utility with a guided, review-first workflow.

          **Bundle ID:** \`${BUNDLE_ID}\`  
          **Version:** \`${VERSION}\`  
          **Build:** \`${BUILD}\`

          ## User workflow

          - **Apps** shows removable temporary cache from validated app containers and lets the user choose exactly which apps to clean.
          - **iOS Leftovers** shows system cache that iOS has already set aside. Selected leftovers are moved into Rescue before deletion.
          - **Rescue** handles staged cache when normal deletion is blocked and keeps full cleanup locked until one real deletion is verified.

          The app now opens on a plain-language home screen, explains the three cleanup stages before the user starts, hides technical identifiers from the normal app list, and keeps troubleshooting details out of the primary flow.

          ## Installation

          \`Storage-Rescue-${VERSION}.ipa\` is unsigned and must be signed/sideloaded using a compatible method for the target device.

          ## Warning

          This is destructive filesystem tooling. Review selections carefully, close apps before clearing their cache, and keep backups of important data.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "build/Storage-Rescue-${VERSION}.ipa" --clobber
            gh release edit "$TAG" --title "Storage Rescue ${VERSION}" --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" "build/Storage-Rescue-${VERSION}.ipa" \
              --target "$GITHUB_SHA" \
              --title "Storage Rescue ${VERSION}" \
              --notes-file /tmp/release-notes.md
          fi
